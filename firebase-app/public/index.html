<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Raspored Sedenja — Prijava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,400;0,600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:     #1a1a2e;
  --navy-mid: #252540;
  --gold:     #c9a84c;
  --gold-light:#e8c96a;
  --gold-dim: #f0d98c;
  --cream:    #f7f3ec;
  --border:   rgba(201,168,76,.22);
  --danger:   #c0392b;
  --font-d: 'Playfair Display', Georgia, serif;
  --font-t: 'Cormorant Infant', Georgia, serif;
  --font-u: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

html, body {
  height: 100%;
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-u);
}

/* background ornament */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(201,168,76,.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(201,168,76,.05) 0%, transparent 60%);
  pointer-events: none;
}

.card {
  background: #20203a;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 44px 40px 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 24px 64px rgba(0,0,0,.45);
  position: relative;
}

.logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 30px;
}
.logo-icon {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, rgba(201,168,76,.18), rgba(201,168,76,.08));
  border: 1.5px solid var(--border);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.logo h1 {
  font-family: var(--font-d);
  font-size: 22px;
  font-weight: 600;
  color: var(--gold-dim);
  letter-spacing: .3px;
  text-align: center;
}
.logo p {
  font-family: var(--font-t);
  font-size: 14px;
  color: rgba(255,255,255,.35);
  font-style: italic;
  margin-top: -6px;
}

.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-bottom: 7px;
}
input {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255,255,255,.06);
  border: 1.5px solid rgba(255,255,255,.1);
  border-radius: 10px;
  font-size: 15px;
  font-family: var(--font-u);
  color: white;
  transition: border-color .18s, background .18s;
  -webkit-text-fill-color: white;
}
input:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(255,255,255,.09);
}
input::placeholder { color: rgba(255,255,255,.2); }
input:-webkit-autofill {
  -webkit-box-shadow: 0 0 0 100px #252544 inset;
  -webkit-text-fill-color: white;
}

.error {
  font-size: 12px;
  color: #e07070;
  margin-bottom: 14px;
  min-height: 16px;
  text-align: center;
}

.btn-login {
  width: 100%;
  padding: 13px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-u);
  font-weight: 600;
  letter-spacing: .3px;
  cursor: pointer;
  transition: background .18s, transform .12s;
  margin-top: 4px;
}
.btn-login:hover  { background: var(--gold-light); }
.btn-login:active { transform: scale(.98); }
.btn-login:disabled {
  background: rgba(201,168,76,.35);
  cursor: not-allowed;
  transform: none;
}

.divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,.07);
  margin: 28px 0 20px;
}
.footer-note {
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,.2);
  font-family: var(--font-t);
  font-style: italic;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </div>
    <h1>Raspored Sedenja</h1>
    <p>Upravljanje venčanjem</p>
  </div>

  <form onsubmit="doLogin(event)">
    <div class="form-group">
      <label for="emailInp">Email</label>
      <input type="email" id="emailInp" autocomplete="email" placeholder="vas@email.com" required>
    </div>
    <div class="form-group">
      <label for="passInp">Lozinka</label>
      <input type="password" id="passInp" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <div class="error" id="errMsg"></div>
    <button type="submit" class="btn-login" id="loginBtn">Prijavi se</button>
  </form>

  <hr class="divider">
  <p class="footer-note">Kontaktirajte administratora za pristup</p>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ── FIREBASE CONFIG ─────────────────────────────────────
// Paste your Firebase web app config here:
const firebaseConfig = {
  apiKey:            "AIzaSyBWMxb9Au5T9eIDgfQOb_eldm_lBc9Zu94",
  authDomain:        "vencanje-planer.firebaseapp.com",
  projectId:         "vencanje-planer",
  storageBucket:     "vencanje-planer.firebasestorage.app",
  messagingSenderId: "461796715872",
  appId:             "1:461796715872:web:6dba54cebc366f466d4205"
};

if (firebaseConfig.apiKey === "ТВОЈ_API_KEY") {
  document.querySelector('.error').textContent = '⚠ Firebase nije konfigurisan — popuni firebaseConfig u index.html';
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Redirect if already logged in
auth.onAuthStateChanged(user => {
  if (user) window.location.replace('/app.html');
});

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errMsg');
  const email = document.getElementById('emailInp').value.trim();
  const pass  = document.getElementById('passInp').value;
  btn.disabled = true;
  btn.textContent = 'Prijavljivanje…';
  err.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged handles redirect
  } catch(ex) {
    btn.disabled = false;
    btn.textContent = 'Prijavi se';
    const codes = {
      'auth/user-not-found':     'Email nije registrovan.',
      'auth/wrong-password':     'Pogrešna lozinka.',
      'auth/invalid-credential': 'Pogrešan email ili lozinka.',
      'auth/too-many-requests':  'Previše pokušaja. Sačekajte malo.',
      'auth/invalid-email':      'Email adresa nije ispravna.'
    };
    err.textContent = codes[ex.code] || ex.message;
  }
}
</script>
</body>
</html>
